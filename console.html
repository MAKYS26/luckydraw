<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto:wght@400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <title>MAKYS — Console (Draw)</title>
    <style>
        body {
            background-color: #030637;
            font-family: 'Roboto', sans-serif;
            color: #333;
        }

        #container1 {
            position: relative;
            overflow: hidden;
            padding: 80px;
            margin-top: 100px;
            margin-bottom: 70px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.7);
            border-radius: 15px;
            text-align: center;
            color: #f5f5f5;
            background: linear-gradient(45deg, #000000, #0A0A0A, #111111, #1A1A1A, #222222);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .floating-shapes {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
        }

        .floating-shapes div {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float 10s infinite ease-in-out;
        }

        .floating-shapes div:nth-child(1) {
            width: 120px;
            height: 120px;
            top: 20%;
            left: 10%;
            animation-duration: 8s;
        }

        .floating-shapes div:nth-child(2) {
            width: 80px;
            height: 80px;
            top: 50%;
            left: 70%;
            animation-duration: 12s;
        }

        .floating-shapes div:nth-child(3) {
            width: 100px;
            height: 100px;
            top: 80%;
            left: 30%;
            animation-duration: 10s;
        }

        .floating-shapes div:nth-child(4) {
            width: 150px;
            height: 150px;
            top: 40%;
            left: 50%;
            animation-duration: 15s;
        }

        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
            100% { transform: translateY(0) rotate(360deg); }
        }

        .sparkles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
        }

        .sparkles div {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            animation: sparkle 2s infinite ease-in-out;
        }

        @keyframes sparkle {
            0% { opacity: 0; transform: scale(0); }
            50% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(0); }
        }

        #container1 h1, #container1 h2 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
        }

        #container1 h2 {
            font-size: 1.8rem;
        }

        #result .card {
            background: #ffffff;
            color: black;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            font-weight: bold;
            padding: 10px;
            margin: 5px;
            display: inline-block;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.5s, transform 0.5s;
            text-align: center;
        }

        #result .card.winner-reveal {
            animation: winnerReveal 0.8s ease-out forwards;
        }

        @keyframes winnerReveal {
            0% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(255, 204, 0, 0.6); }
            50% { transform: scale(1.08); box-shadow: 0 0 25px 10px rgba(255, 204, 0, 0.4); }
            100% { transform: scale(1); box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25); }
        }

        #container1 button {
            font-size: 1.1rem;
            font-weight: bold;
            text-transform: uppercase;
            margin: 10px;
            padding: 12px 20px;
            border-radius: 30px;
            border: none;
            color: #fff;
            background: linear-gradient(135deg, #4CAF50, #2E7D32);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s, box-shadow 0.3s, background 0.3s;
        }

        #container1 button:hover {
            transform: scale(1.1);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
            background: linear-gradient(135deg, #2E7D32, #1B5E20);
        }

        #fullscreenButton {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: none;
            border: none;
            color: #fff;
            font-size: 1.5rem;
            cursor: pointer;
            transition: transform 0.3s, color 0.3s;
            padding: 8px;
        }

        #fullscreenButton:hover {
            transform: scale(1.2);
            color: #ffcc00;
        }

        #container2 {
            background: linear-gradient(45deg, #1a0a1a, #2d0d2d, #1a0a1a, #250d25);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.7);
            padding: 50px;
            margin-bottom: 50px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #container2 h2, #container2 h3 {
            color: #fff;
        }

        #container2 .form-control {
            background-color: rgba(255, 255, 255, 0.95);
            border-color: rgba(255, 255, 255, 0.3);
        }

        #previousResults.empty {
            color: #aaa;
            font-style: italic;
        }

        @media (max-width: 767px) {
            #container1, #container2 {
                padding: 20px;
                margin-top: 20px;
            }

            h1, h2, h3 {
                font-size: 1.2rem;
            }

            #inputNames {
                font-size: 0.9rem;
            }

            .btn {
                font-size: 0.9rem;
                padding: 8px 15px;
            }
        }

        /* Custom CSS for fullscreen modal */
        #slotMachineModal .modal-dialog {
            margin: 0;
            width: 100vw;
            height: 100vh;
            max-width: none;
            overflow: hidden;
        }

        #slotMachineModal .modal-content {
            height: 100%;
            border-radius: 0;
            overflow: hidden;
        }

        #slotMachineModal .modal-body {
            padding: 0;
            margin: 0;
            overflow: hidden;
        }

        #slotMachineModal iframe {
            width: 100%;
            height: 100%;
            border: none;
            overflow: hidden;
        }

        .back-to-home {
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 1001;
            color: rgba(255, 255, 255, 0.9);
            text-decoration: none;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: color 0.3s;
        }
        .back-to-home:hover {
            color: #ffcc00;
        }

        /* Fullscreen: reduce padding/margin so drawn cards use more of the screen */
        #container1:fullscreen {
            padding: 24px;
            margin: 0;
            box-sizing: border-box;
        }
        #container1:-webkit-full-screen {
            padding: 24px;
            margin: 0;
            box-sizing: border-box;
        }
        #container1:-ms-fullscreen {
            padding: 24px;
            margin: 0;
            box-sizing: border-box;
        }
        #container1::backdrop {
            background: #030637;
        }
        #container1:fullscreen #result .card {
            margin: 4px;
            padding: 8px;
        }
        #container1:-webkit-full-screen #result .card,
        #container1:-ms-fullscreen #result .card {
            margin: 4px;
            padding: 8px;
        }
        body.display-mode .back-to-home { display: none; }
        .mode-badge {
            position: fixed;
            top: 12px;
            right: 12px;
            z-index: 1002;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.75rem;
            background: rgba(201, 162, 39, 0.25);
            border: 1px solid rgba(201, 162, 39, 0.5);
            color: #f0e6b4;
        }
    </style>
    <script src="https://www.gstatic.com/firebasejs/9.21.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.21.0/firebase-database-compat.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <div class="container" id="container1">
        <!-- Floating shapes and sparkles -->

        </div>

        <!-- Heading -->
        <h1 style="text-align: center; color: white;"> MALAM ANUGERAH </h1>
        <h1 style="text-align: center; color: white;"> KUMPULAN YAYASAN SABAH </h1>

        <!-- Buttons -->
        <div class="text-center mb-4 mt-4">

        <div class="modal fade" id="slotMachineModal" tabindex="-1" aria-labelledby="slotMachineModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-fullscreen">

    <div class="container" id="container2">
        <h2 style="color: antiquewhite;">Items</h2>
        <textarea class="form-control" id="inputNames" rows="5" placeholder="Enter names or numbers here..."></textarea>
        <div class="mt-4">
            <label for="numberOfDraws" style="color: antiquewhite;">No. of Draw:</label>

    <script>
        (function() {
        const searchParams = new URLSearchParams(window.location.search);
        const viewMode = (searchParams.get('mode') || 'control').toLowerCase();
        const isControl = viewMode !== 'display';
        const isDisplay = !isControl;

        if (isDisplay) {
            document.body.classList.add('display-mode');
            document.title = 'MAKYS — Projector (display)';
        }

        const firebaseConfig = {
            apiKey: "AIzaSyC5Vuf0oNnh4imHtZs9jnkVWC9VxrDkLjA",
            authDomain: "makysdraw-87237.firebaseapp.com",
            databaseURL: "https://makysdraw-87237-default-rtdb.firebaseio.com",
            projectId: "makysdraw-87237",
            storageBucket: "makysdraw-87237.firebasestorage.app",
            messagingSenderId: "1044977366090",
            appId: "1:1044977366090:web:37af3eaa9c3f5bfc7822b3"
        };

        const app = firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let items = [];
        let drawnItems = [];
        let allResults = [];
        let currentFontSize = 71;
        let lastProcessedDrawId = null;
        let drawInProgress = false;
        const SESSION_TTL_MS = 3 * 60 * 1000;

        const slotMachineSound = new Audio('slot-machine.mp3');
        slotMachineSound.loop = true;

        /** Deterministic Fisher–Yates using integer seed (same on control + display). */
        function shuffleSeededFromPool(pool, numberOfDraws, seed) {
            const a = pool.slice();
            let s = (seed & 0xffffffff) >>> 0;
            for (var i = a.length - 1; i > 0; i--) {
                s = (Math.imul(1664525, s) + 1013904223) >>> 0;
                const j = s % (i + 1);
                const tmp = a[i];
                a[i] = a[j];
                a[j] = tmp;
            }
            return a.slice(0, numberOfDraws);
        }

        function getStablePool() {
            const availableItems = items.filter(function(item) { return !drawnItems.includes(item); });
            availableItems.sort(function(a, b) { return String(a).localeCompare(String(b), undefined, { numeric: true, sensitivity: 'base' }); });
            return availableItems;
        }

        function playSound(soundFile) {
            const audio = new Audio(soundFile);
            audio.play();
        }

        function createSparkles() {
            const sparklesContainer = document.getElementById('sparkles');
            const numSparkles = 50;
            for (var i = 0; i < numSparkles; i++) {
                const sparkle = document.createElement('div');
                sparkle.style.left = (Math.random() * 100) + '%';
                sparkle.style.top = (Math.random() * 100) + '%';
                sparkle.style.animationDelay = (Math.random() * 2) + 's';
                sparklesContainer.appendChild(sparkle);
            }
        }

        function writeDataToFirebase() {
            if (!isControl) return;
            database.ref('drawResults').update({
                items: items,
                drawnItems: drawnItems,
                allResults: allResults
            });
        }

        function getConsoleSettingsFromInputs() {
            return {
                numberOfDraws: Math.max(1, parseInt(document.getElementById('numberOfDraws').value, 10) || 1),
                slotDurationSec: Math.max(3, Math.min(15, parseInt(document.getElementById('slotDurationInput').value, 10) || 5)),
                fontSizePx: Math.max(10, parseInt(document.getElementById('fontSizeInput').value, 10) || 71),
                updatedAt: Date.now()
            };
        }

        function applyConsoleSettings(settings) {
            if (!settings) return;
            const numberOfDraws = Math.max(1, parseInt(settings.numberOfDraws, 10) || 1);
            const slotDurationSec = Math.max(3, Math.min(15, parseInt(settings.slotDurationSec, 10) || 5));
            const fontSizePx = Math.max(10, parseInt(settings.fontSizePx, 10) || 71);
            document.getElementById('numberOfDraws').value = numberOfDraws;
            document.getElementById('slotDurationInput').value = slotDurationSec;
            document.getElementById('fontSizeInput').value = fontSizePx;
            currentFontSize = fontSizePx;
        }

        function writeConsoleSettings() {
            database.ref('drawSession/settings').set(getConsoleSettingsFromInputs());
        }

        function removeDuplicates(array) {
            return Array.from(new Set(array));
        }

        function updatePreviousResults() {
            const previousResultsList = document.getElementById('previousResults');
            if (!previousResultsList) return;
            previousResultsList.innerHTML = allResults.length === 0
                ? "<li class='list-group-item empty'>No results yet</li>"
                : allResults.map(function(result, index) { return "<li class='list-group-item'>Draw " + (index + 1) + ': ' + result + '</li>'; }).join('');
            previousResultsList.style.display = 'block';
        }

        function runMirroredDrawSequence(p) {
            if (!p || !p.drawId) return;
            if (p.drawId === lastProcessedDrawId) return;
            if (p.status && p.status !== 'pending') return;
            if (p.createdAt && (Date.now() - p.createdAt) > SESSION_TTL_MS) {
                console.warn('drawSession: ignoring stale draw', p.drawId);
                return;
            }
            if (drawInProgress) {
                console.warn('drawSession: draw already in progress, ignoring', p.drawId);
                return;
            }

            const numberOfDraws = Math.max(1, parseInt(p.numberOfDraws, 10) || 1);
            const slotDuration = Math.max(3000, Math.min(15000, parseInt(p.slotDurationMs, 10) || 5000));
            const seed = (Number(p.seed) >>> 0) || 0;

            const modal = new bootstrap.Modal(document.getElementById('slotMachineModal'));
            const iframe = document.querySelector('#slotMachineModal iframe');

            if (!iframe) {
                if (isControl) alert('Slot view failed to load.');
                return;
            }
            if (!iframe.src || iframe.src === '' || (iframe.getAttribute('src') || '').endsWith('about:blank')) {
                iframe.src = 'slotmac.html';
            }
            iframe.onload = function () {
                if (iframe.contentWindow) iframe.contentWindow.postMessage('resetAnimation', '*');
            };
            lastProcessedDrawId = p.drawId;
            drawInProgress = true;
            if (isControl) {
                document.getElementById('drawButton').disabled = true;
            }
            slotMachineSound.play().catch(function(err) { console.warn('Audio autoplay blocked:', err); });
            modal.show();

            setTimeout(function () {
                try {
                    modal.hide();
                } catch (e) { /* noop */ }
                slotMachineSound.pause();
                slotMachineSound.currentTime = 0;

                database.ref('drawResults').once('value').then(function (snap) {
                applyDrawResultsSnapshot(snap.val() || {});

                const pool = getStablePool();
                if (numberOfDraws > pool.length) {
                    if (isControl) {
                        database.ref('drawSession/current').remove();
                        alert('No items left to complete this draw (data out of sync).');
                    }
                    lastProcessedDrawId = null;
                    finishDrawSequence();
                    return;
                }
                const selectedItems = shuffleSeededFromPool(pool, numberOfDraws, seed);

                if (isControl) {
                    drawnItems = drawnItems.concat(selectedItems);
                    allResults.push(selectedItems.join(', '));
                    items = items.filter(function(item) { return !selectedItems.includes(item); });
                    writeDataToFirebase();
                    if (document.getElementById('inputNames')) {
                        document.getElementById('inputNames').value = items.join(', ');
                    }
                    updatePreviousResults();
                }

                const resultDiv = document.getElementById('result');
                resultDiv.innerHTML = '';
                resultDiv.style.display = 'block';

                if (numberOfDraws === 1) {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.style.fontSize = currentFontSize + 'px';
                    resultDiv.appendChild(card);
                    card.style.opacity = 0;
                    requestAnimationFrame(function() {
                        card.classList.add('winner-reveal');
                        card.style.transition = 'opacity 0.5s';
                        card.style.opacity = 1;
                    });
                    fadeInCharacterByCharacter(selectedItems[0], card);
                } else {
                    selectedItems.forEach(function(item, index) {
                        const card = document.createElement('div');
                        card.className = 'card';
                        card.style.fontSize = currentFontSize + 'px';
                        card.innerText = item;
                        resultDiv.appendChild(card);
                        setTimeout(function() {
                            card.style.opacity = 0;
                            requestAnimationFrame(function() {
                                card.classList.add('winner-reveal');
                                card.style.opacity = 1;
                                card.style.transform = 'translateY(0)';
                            });
                        }, index * 800);
                        if ((index + 1) % 9 === 0) {
                            const lineBreak = document.createElement('br');
                            resultDiv.appendChild(lineBreak);
                        }
                    });
                }
                setTimeout(function() { playSound('fanfare-sound.mp3'); }, 400);
                if (isControl) {
                    document.getElementById('removeDrawnButton').style.display = drawnItems.length > 0 ? 'inline-block' : 'none';
                }

                if (isControl) {
                    database.ref('drawSession/current').remove();
                }
                finishDrawSequence();
                }).catch(function (err) {
                    console.warn('drawResults once failed:', err);
                    lastProcessedDrawId = null;
                    if (isControl) {
                        database.ref('drawSession/current').remove();
                    }
                    finishDrawSequence();
                });
            }, slotDuration);
        }

        function finishDrawSequence() {
            drawInProgress = false;
            if (isControl) {
                document.getElementById('drawButton').disabled = false;
            }
        }

        function queueDraw() {
            if (!isControl) return;
            const numberOfDraws = parseInt(document.getElementById('numberOfDraws').value, 10) || 1;
            const availableCount = items.filter(function(item) { return !drawnItems.includes(item); }).length;
            if (availableCount === 0) {
                alert('No items left to draw. Add more items or clear drawn history.');
                return;
            }
            if (numberOfDraws < 1 || numberOfDraws > availableCount) {
                alert('Number of draws cannot exceed the number of remaining items (' + availableCount + ').');
                return;
            }
            if (drawInProgress) {
                return;
            }
            const slotSec = Math.max(3, Math.min(15, parseInt(document.getElementById('slotDurationInput').value, 10) || 5));
            var seedU32;
            if (window.crypto && crypto.getRandomValues) {
                seedU32 = (crypto.getRandomValues(new Uint32Array(1))[0]) >>> 0;
            } else {
                seedU32 = (Math.floor(Math.random() * 0xffffffff) >>> 0);
            }
            const drawId = 'd-' + Date.now() + '-' + seedU32;
            const payload = {
                drawId: drawId,
                seed: seedU32,
                numberOfDraws: numberOfDraws,
                slotDurationMs: slotSec * 1000,
                status: 'pending',
                createdAt: Date.now()
            };
            database.ref('drawSession/current').set(payload);
        }

        document.getElementById('drawButton').addEventListener('click', function () {
            if (!isControl) return;
            queueDraw();
        });

        document.getElementById('removeDrawnButton').addEventListener('click', function () {
            if (!isControl) return;
            drawnItems = [];
            document.getElementById('result').innerHTML = '';
            writeDataToFirebase();
            document.getElementById('removeDrawnButton').style.display = 'none';
        });

        document.getElementById('fullscreenButton').addEventListener('click', function () {
            const container1 = document.getElementById('container1');
            if (!document.fullscreenElement) {
                if (container1.requestFullscreen) {
                    container1.requestFullscreen();
                } else if (container1.webkitRequestFullscreen) {
                    container1.webkitRequestFullscreen();
                } else if (container1.msRequestFullscreen) {
                    container1.msRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
            }
        });

        document.getElementById('exportButton').addEventListener('click', function () {
            if (!isControl) return;
            if (allResults.length === 0) {
                alert("No results to export.");
                return;
            }

            let csvContent = "data:text/csv;charset=utf-8,";
            csvContent += "Draw Number,Results\n";
            allResults.forEach((result, index) => {
                const row = `Draw ${index + 1},"${result}" \n`;
                csvContent += row;
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "draw_results.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });

        document.getElementById('clearHistoryButton').addEventListener('click', function () {
            if (!isControl) return;
            const confirmClear = confirm("Are you sure you want to clear the draw history? All drawn items will be restored to the pool.");
            if (!confirmClear) return;

            // Restore drawn items back to the pool
            items = removeDuplicates([...items, ...drawnItems]);
            drawnItems = [];
            allResults = [];
            writeDataToFirebase();
            document.getElementById('inputNames').value = items.join(', ');
            document.getElementById('previousResults').innerHTML = `<li class='list-group-item empty'>No results yet</li>`;
            document.getElementById('result').innerHTML = '';
            document.getElementById('result').style.display = 'none';
            document.getElementById('removeDrawnButton').style.display = 'none';
            alert("Draw history has been cleared. All drawn items have been restored to the pool.");
        });

        document.getElementById('numberOfDraws').addEventListener('input', function () {
            writeConsoleSettings();
        });

        document.getElementById('slotDurationInput').addEventListener('input', function () {
            writeConsoleSettings();
        });

        document.getElementById('fontSizeInput').addEventListener('input', function () {
            currentFontSize = Math.max(10, parseInt(this.value, 10) || 71);
            writeConsoleSettings();
        });

        function applyDrawResultsSnapshot(data) {
            if (!data) return;
            const rawItems = data.items || [];
            items = rawItems.map(function (item) {
                if (typeof item === 'object' && item !== null && item.data) {
                    return item.data;
                }
                return String(item);
            });
            items = removeDuplicates(items.filter(function (x) { return x.trim() !== ''; }));
            drawnItems = data.drawnItems || [];
            allResults = data.allResults || [];
        }

        function syncDrawResultsFromFirebase() {
            database.ref('drawResults').on('value', function (snapshot) {
                const data = snapshot.val();
                if (!data) return;
                applyDrawResultsSnapshot(data);
                if (isControl) {
                    document.getElementById('inputNames').value = items.join(', ');
                }
                updatePreviousResults();
                if (isControl) {
                    writeDataToFirebase();
                }
            });
        }

        window.onload = function () {
            createSparkles();
            syncDrawResultsFromFirebase();
            database.ref('drawSession/settings').on('value', function (snapshot) {
                const settings = snapshot.val();
                if (!settings) return;
                applyConsoleSettings(settings);
            });
            database.ref('drawSession/current').on('value', function (snapshot) {
                const p = snapshot.val();
                if (!p) return;
                runMirroredDrawSequence(p);
            });
            writeConsoleSettings();
        };

        document.getElementById('inputNames').addEventListener('input', function () {
            if (!isControl) return;
            const input = this.value;
            items = removeDuplicates(input.split(/[,|\n]+/).map(function (i) { return i.trim(); }).filter(Boolean));
            writeDataToFirebase();
        });

        document.addEventListener('DOMContentLoaded', function () {
            const badge = document.getElementById('modeBadge');
            if (badge) {
                badge.textContent = isControl ? 'Console: control' : 'Console: display (projector)';
                badge.style.display = 'block';
            }
            if (isDisplay) {
                document.getElementById('drawButton').style.display = 'none';
                document.getElementById('removeDrawnButton').style.display = 'none';
            }
            const inp = document.getElementById('inputNames');
            if (inp) inp.readOnly = !isControl;
            currentFontSize = Math.max(10, parseInt(document.getElementById('fontSizeInput').value, 10) || 71);
            if (isControl) {
                const sanitizeButton = document.createElement('button');
                sanitizeButton.className = 'btn btn-info mt-4';
                sanitizeButton.innerHTML = '<i class="fas fa-broom"></i> Sanitize Data';
                sanitizeButton.onclick = sanitizeFirebaseData;
                document.getElementById('container2').appendChild(sanitizeButton);
            }
        });

        function fadeInCharacterByCharacter(text, container) {
            container.innerHTML = ''; // Clear previous content
            let index = 0;

            function showNextCharacter() {
                if (index < text.length) {
                    const span = document.createElement('span');
                    span.innerText = text[index];
                    span.style.opacity = '0';
                    span.style.transition = 'opacity 0.3s ease-in-out';
                    span.style.display = 'inline-block'; // Ensures characters appear in a line
                    container.appendChild(span);

                    // Small delay to trigger opacity transition
                    setTimeout(() => {
                        span.style.opacity = '1';
                    }, 50 * index);

                    index++;
                    setTimeout(showNextCharacter, 2000); // Controls the speed of character appearance
                }
            }

            showNextCharacter();
        }

        // THIRD: One-time cleanup function to fix existing corrupted data
        function sanitizeFirebaseData() {
            if (!isControl) return;
            console.log('Starting Firebase data sanitization...');
            database.ref('drawResults').once('value')
                .then((snapshot) => {
                    const data = snapshot.val();
                    if (!data) {
                        console.log('No data to sanitize');
                        return;
                    }
                    
                    const rawItems = data.items || [];
                    
                    // Convert all items to strings
                    const sanitizedItems = rawItems.map(item => {
                        if (typeof item === 'object' && item !== null && item.data) {
                            console.log('Converting object to string:', item.data);
                            return item.data;
                        }
                        return String(item);
                    }).filter(item => item.trim() !== '');
                    
                    // Remove duplicates
                    const uniqueItems = [...new Set(sanitizedItems)];
                    
                    console.log('Sanitized items:', uniqueItems);
                    
                    // Update Firebase with clean data
                    return database.ref('drawResults').update({
                        items: uniqueItems,
                        drawnItems: data.drawnItems || [],
                        allResults: data.allResults || []
                    });
                })
                .then(() => {
                    console.log('Firebase data sanitized successfully');
                    alert('Data sanitization completed successfully!');
                })
                .catch(error => {
                    console.error('Error sanitizing data:', error);
                    alert('Error during data sanitization: ' + error.message);
                });
        }

        })();
    </script>
</body>
</html>
