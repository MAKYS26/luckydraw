<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading Animation</title>
    <style>
        :root{
            --bg0:#050508;
            --bg1:#0b0b12;
            --gold0:#fff3bf;
            --gold1:#ffd56a;
            --gold2:#ffb224;
            --gold3:#8a4a00;
            --ice:#a5f3fc;
            --violet:#c4b5fd;
            --ink:rgba(255,255,255,.92);
            --muted:rgba(255,255,255,.72);
        }

        /* General Styles */
        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
            background:
                radial-gradient(900px 650px at 20% 18%, rgba(196,181,253,.16), transparent 60%),
                radial-gradient(900px 700px at 78% 26%, rgba(165,243,252,.12), transparent 62%),
                radial-gradient(1100px 900px at 50% 110%, rgba(255,178,36,.09), transparent 60%),
                linear-gradient(45deg, #000000, #0a0a0a, #111111, #1a1a1a, #222222);
            background-size: auto, auto, auto, 400% 400%;
            animation: gradientBG 16s ease infinite;
            font-family: 'Arial', sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        body::before{
            content:"";
            position:absolute;
            inset:-40vmax;
            pointer-events:none;
            background:
                radial-gradient(circle at 50% 45%, rgba(255,255,255,.06) 0 34%, rgba(0,0,0,.72) 62%, rgba(0,0,0,.90) 80%);
            filter: blur(10px);
            opacity:.9;
        }

        /* Animated gradient background */
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Floating shapes (circles) */
        .floating-shapes {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events:none;
        }

        .floating-shapes div {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float 10s infinite ease-in-out;
            filter: blur(.2px);
        }

        /* Randomize size and position of floating shapes */
        .floating-shapes div:nth-child(1) {
            width: 120px;
            height: 120px;
            top: 20%;
            left: 10%;
            animation-duration: 8s;
        }

        .floating-shapes div:nth-child(2) {
            width: 80px;
            height: 80px;
            top: 50%;
            left: 70%;
            animation-duration: 12s;
        }

        .floating-shapes div:nth-child(3) {
            width: 100px;
            height: 100px;
            top: 80%;
            left: 30%;
            animation-duration: 10s;
        }

        .floating-shapes div:nth-child(4) {
            width: 150px;
            height: 150px;
            top: 40%;
            left: 50%;
            animation-duration: 15s;
        }

        /* Floating animation */
        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
            100% { transform: translateY(0) rotate(360deg); }
        }

        /* Sparkling effect */
        .sparkles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events:none;
            z-index: 3;
        }

        .sparkles div {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            animation: sparkle 2s infinite ease-in-out;
            box-shadow: 0 0 18px rgba(255,255,255,.45);
        }

        /* Sparkle animation */
        @keyframes sparkle {
            0% { opacity: 0; transform: scale(0); }
            50% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(0); }
        }

        /* Slot Machine Container */
        .slot-machine {
            display: flex;
            gap: 38px;
            padding: 40px;
            background:
                radial-gradient(360px 180px at 50% 0%, rgba(255,213,106,.22), transparent 65%),
                linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,.06));
            border-radius: 24px;
            box-shadow:
                0 0 70px rgba(255, 255, 255, 0.22),
                0 32px 120px rgba(0,0,0,.65);
            border: 1px solid rgba(255,255,255,.26);
            position: relative;
            z-index: 10;
            transform: translateY(-20px); /* Moves the slot machine higher */
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            isolation: isolate;
        }

        .slot-machine::before{
            content:"";
            position:absolute;
            inset:-2px;
            border-radius: 26px;
            background: conic-gradient(from 210deg,
                rgba(255,213,106,.55),
                rgba(165,243,252,.25),
                rgba(196,181,253,.25),
                rgba(255,178,36,.45),
                rgba(255,213,106,.55)
            );
            filter: blur(18px);
            opacity:.55;
            z-index:-1;
        }

        .slot-machine::after{
            content:"";
            position:absolute;
            inset: 8px;
            border-radius: 18px;
            pointer-events:none;
            background:
                linear-gradient(120deg, transparent 35%, rgba(255,255,255,.18) 45%, transparent 55%);
            transform: translateX(-60%);
            animation: glassSweep 3.6s cubic-bezier(.2,.9,.2,1) infinite;
            mix-blend-mode: screen;
            opacity:.65;
        }

        @keyframes glassSweep{
            0%,22%{ transform: translateX(-70%); opacity:0; }
            38%{ opacity:.75; }
            60%{ transform: translateX(70%); opacity:0; }
            100%{ transform: translateX(70%); opacity:0; }
        }

        /* Carousel Container */
        .carousel {
            width: 200px;
            height: 250px;
            overflow: hidden;
            position: relative;
            background: #000000;
            border-radius: 18px;
            border: 1px solid rgba(255,255,255,.38);
            box-shadow:
                inset 0 0 26px rgba(255, 255, 255, 0.20),
                inset 0 -18px 60px rgba(0,0,0,.65),
                0 0 26px rgba(255, 255, 255, 0.22);
        }

        /* Carousel Items */
        .carousel-items {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            will-change: transform;
            animation: scroll var(--dur, 4000ms) linear infinite;
        }

        .carousel-item {
            height: 250px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 4.2rem;
            font-weight: 800;
            letter-spacing: .04em;
            color: transparent;
            background: linear-gradient(180deg, var(--gold0), var(--gold1) 38%, var(--gold2) 62%, var(--gold3));
            -webkit-background-clip: text;
            background-clip: text;
            text-shadow:
                0 0 12px rgba(255,213,106,.20),
                0 0 28px rgba(255,255,255,.10);
        }

        /* Animation */
        @keyframes scroll {
            0% { transform: translateY(0); }
            100% { transform: translateY(-50%); }
        }

        /* Heading container */
        h1 {
            margin-bottom: 40px;
            font-size: clamp(44px, 4.2vw, 76px);
            font-family: 'Georgia', serif;
            color: #ffffff;
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            margin-top: -55px; /* Moves the text higher */
            text-shadow: 0 0 18px rgba(255,255,255,.20), 0 28px 90px rgba(0,0,0,.75);
            letter-spacing: .02em;
        }

        /* Loading dots */
        .loading-dots {
            display: inline-block;
            width: 3ch;
            text-align: left;
            margin-left: .25em;
        }

        /* Style for "Done!" text */
        .done-text {
            color: #00ff00;
            text-align: center;
        }
    </style>
</head>
<body>
    <!-- Animated background elements -->
    <div class="floating-shapes">
        <div></div>
        <div></div>
        <div></div>
        <div></div>
    </div>
    <div class="sparkles" id="sparkles"></div>

    <!-- Heading with static text and animated dots -->
    <h1 id="heading">
        &emsp;&emsp;Selecting Winners
        <span class="loading-dots"></span>
    </h1>

    <!-- Slot Machine Container -->
    <div class="slot-machine">
        <!-- Carousel 1 -->
        <div class="carousel">
            <div class="carousel-items" id="carousel1"></div>
        </div>

        <!-- Carousel 2 -->
        <div class="carousel">
            <div class="carousel-items" id="carousel2"></div>
        </div>

        <!-- Carousel 3 -->
        <div class="carousel">
            <div class="carousel-items" id="carousel3"></div>
        </div>

        <!-- Carousel 4 -->
        <div class="carousel">
            <div class="carousel-items" id="carousel4"></div>
        </div>

        <!-- Carousel 5 -->
        <div class="carousel">
            <div class="carousel-items" id="carousel5"></div>
        </div>
    </div>

    <!-- Audio for spinning sound effect -->
    <audio id="spinningSound" loop>
        <source src="spinning-sound.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <script>
        // Function to reset the animation
        function resetAnimation() {
            const heading = document.getElementById('heading');
            heading.innerHTML = "&emsp;&emsp;Selecting Winners<span class='loading-dots'></span>";

            // Restart the loading dots animation
            animateLoadingDots();

            // Commented out the "Done!" functionality
            /*
            setTimeout(() => {
                heading.innerHTML = "<span class='done-text'>Done!</span>";
            }, 7000); // 7000 milliseconds = 7 seconds
            */
        }

        // Function to animate the loading dots
        function animateLoadingDots() {
            const dotsElement = document.querySelector('.loading-dots');
            let dots = '';
            let count = 0;

            const interval = setInterval(() => {
                dots = '.'.repeat(count % 3 + 1); // Cycle through 1, 2, 3 dots
                dotsElement.textContent = dots;
                count++;
            }, 500); // Update every 500ms
        }

        // Get the audio element
        const spinningSound = document.getElementById("spinningSound");

        function shuffleInPlace(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function animateCarousels() {
            const carousels = [
                document.getElementById('carousel1'),
                document.getElementById('carousel2'),
                document.getElementById('carousel3'),
                document.getElementById('carousel4'),
                document.getElementById('carousel5')
            ];

            // Generate an array of numbers from 0001 to 1400
            const numbers = Array.from({ length: 1400 }, (_, i) => (i + 1).toString().padStart(4, '0'));

            carousels.forEach((carousel, index) => {
                // Clear existing items
                carousel.innerHTML = '';

                // Shuffle independently per reel
                const shuffledNumbers = shuffleInPlace(numbers.slice());

                // Build a longer strip + duplicate for seamless loop
                // Match the reference tempo: 10 items per reel cycle
                const take = 10;
                const slice = shuffledNumbers.slice(0, take);
                const doubled = slice.concat(slice);

                for (let i = 0; i < doubled.length; i++) {
                    const item = document.createElement('div');
                    item.className = 'carousel-item';
                    item.textContent = doubled[i];
                    carousel.appendChild(item);
                }

                // Animate the carousel
                const duration = 3000 + index * 500; // Staggered animation duration (original tempo)
                carousel.style.setProperty('--dur', `${duration}ms`);

                // Play the sound when the animation starts
                if (index === 0) {
                    spinningSound.currentTime = 0; // Restart the sound
                    spinningSound.play().catch(() => {});
                }

                // Stop the sound when the last animation completes
                setTimeout(() => {
                    if (index === carousels.length - 1) {
                        spinningSound.pause();
                    }
                }, duration);
            });
        }

        // Start the loading dots animation
        animateLoadingDots();

        // Reset the animation when the page loads (for the first time)
        resetAnimation();

        // Populate and animate carousels
        animateCarousels();

        // Add sparkles (pure DOM, lightweight)
        (function makeSparkles(){
            const root = document.getElementById('sparkles');
            if (!root) return;
            const n = 70;
            const frag = document.createDocumentFragment();
            for (let i = 0; i < n; i++){
                const s = document.createElement('div');
                const size = 2 + Math.random() * 3;
                s.style.width = `${size}px`;
                s.style.height = `${size}px`;
                s.style.left = `${Math.random() * 100}%`;
                s.style.top = `${Math.random() * 100}%`;
                s.style.opacity = `${0.15 + Math.random() * 0.75}`;
                s.style.animationDelay = `${Math.random() * 2.2}s`;
                s.style.animationDuration = `${1.6 + Math.random() * 2.6}s`;
                frag.appendChild(s);
            }
            root.appendChild(frag);
        })();
    </script>
</body>
</html>
