<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanned Tickets – MAKYS Display</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0f;
            --card-bg: #14141f;
            --accent: #22c55e;
            --text: #f0f0f0;
            --text-muted: rgba(255,255,255,0.6);
        }
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }
        .header {
            position: relative;
            text-align: left;
            padding: 20px 100px 20px 24px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .header h1 {
            font-size: clamp(2.5rem, 6vw, 4rem);
            font-weight: 700;
            margin: 0 0 6px 0;
            color: var(--text);
        }
        .header .subtitle {
            font-size: clamp(1.2rem, 3vw, 1.6rem);
            color: var(--text-muted);
            margin: 0;
        }
        .counter-badge {
            display: inline-block;
            margin-top: 8px;
            padding: 6px 14px;
            border-radius: 999px;
            border: 1px solid rgba(255,255,255,0.25);
            font-weight: 600;
            font-size: clamp(0.95rem, 2.2vw, 1.2rem);
            color: var(--text);
            background: rgba(255,255,255,0.06);
        }
        .change-counter-btn {
            margin-top: 10px;
            margin-left: 10px;
            padding: 6px 12px;
            border-radius: 999px;
            border: 1px solid rgba(255,255,255,0.35);
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            opacity: 1;
            transition: opacity 0.35s ease, background 0.2s ease;
        }
        .change-counter-btn:hover {
            background: rgba(255,255,255,0.18);
        }
        .change-counter-btn.is-faded {
            opacity: 0;
            pointer-events: none;
        }
        .total-badge {
            position: absolute;
            top: 50%;
            right: 24px;
            transform: translateY(-50%);
            padding: 8px 20px;
            background: var(--accent);
            color: #000;
            font-weight: 700;
            font-size: clamp(1rem, 3vw, 1.75rem);
            border-radius: 999px;
        }
        .grid-container {
            padding: 28px 24px 56px;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
            max-width: 1800px;
            margin: 0 auto;
        }
        .ticket-card {
            background: var(--card-bg);
            border: 2px solid rgba(255,255,255,0.25);
            border-radius: 12px;
            padding: 28px 20px;
            text-align: center;
            font-weight: 600;
            font-size: clamp(2.96rem, 7.61vw, 4.65rem);
            color: var(--text);
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .ticket-card:hover {
            border-color: rgba(34, 197, 94, 0.7);
            box-shadow: 0 0 12px rgba(34, 197, 94, 0.15);
        }
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-muted);
            font-size: clamp(1.35rem, 3vw, 1.75rem);
        }
        .empty-state i {
            font-size: 5rem;
            margin-bottom: 20px;
            opacity: 0.5;
        }
        .counter-selector-overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(5, 5, 10, 0.92);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .counter-selector-card {
            width: min(760px, 100%);
            background: #171722;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 14px;
            padding: 22px;
            text-align: center;
        }
        .counter-selector-card h2 {
            margin: 0 0 10px;
            font-size: clamp(1.3rem, 3vw, 2rem);
        }
        .counter-selector-card p {
            margin: 0 0 16px;
            color: var(--text-muted);
        }
        .counter-buttons {
            display: grid;
            grid-template-columns: repeat(4, minmax(90px, 1fr));
            gap: 10px;
        }
        .counter-btn {
            border: 1px solid rgba(255,255,255,0.25);
            background: #24243a;
            color: #fff;
            border-radius: 10px;
            padding: 12px 10px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
        }
        .counter-btn:hover {
            background: #2c2c45;
        }
    </style>
</head>
<body>
    <script>if(!sessionStorage.getItem('staffAuth'))location.replace('StaffLogin.html');</script>
    <div class="header">
        <h1>Cabutan Tiket Bertuah</h1>
        <p class="subtitle" id="subtitleText">Sila pastkan nombor tiket anda tertera di skrin</p>
        <div class="counter-badge" id="counterBadge" style="display:none;"></div>
        <button class="change-counter-btn" id="changeCounterBtn" style="display:none;" type="button">Change Counter</button>
        <div class="total-badge" id="totalCount">0</div>
    </div>

    <div class="grid-container" id="grid"></div>
    <div class="empty-state" id="emptyState" style="display: none;">
        <i class="fas fa-qrcode"></i>
        <p id="emptyText">No tickets scanned yet for this counter.</p>
    </div>
    <div class="counter-selector-overlay" id="counterSelectorOverlay" style="display:none;">
        <div class="counter-selector-card">
            <h2>Select Monitor Counter</h2>
            <p>Choose which counter this monitor should display.</p>
            <div class="counter-buttons">
                <button class="counter-btn" data-counter="1">Counter 1</button>
                <button class="counter-btn" data-counter="2">Counter 2</button>
                <button class="counter-btn" data-counter="3">Counter 3</button>
                <button class="counter-btn" data-counter="4">Counter 4</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.21.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.21.0/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC5Vuf0oNnh4imHtZs9jnkVWC9VxrDkLjA",
            authDomain: "makysdraw-87237.firebaseapp.com",
            databaseURL: "https://makysdraw-87237-default-rtdb.firebaseio.com",
            projectId: "makysdraw-87237",
            storageBucket: "makysdraw-87237.firebasestorage.app",
            messagingSenderId: "1044977366090",
            appId: "1:1044977366090:web:37af3eaa9c3f5bfc7822b3"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const gridEl = document.getElementById('grid');
        const totalEl = document.getElementById('totalCount');
        const emptyEl = document.getElementById('emptyState');
        const emptyTextEl = document.getElementById('emptyText');
        const subtitleEl = document.getElementById('subtitleText');
        const counterBadgeEl = document.getElementById('counterBadge');
        const changeCounterBtnEl = document.getElementById('changeCounterBtn');
        const selectorOverlayEl = document.getElementById('counterSelectorOverlay');
        const COUNTER_STORAGE_KEY = 'scannedDisplayCounterId';
        const CHANGE_COUNTER_IDLE_MS = 2500;
        let selectedCounterId = '';
        let latestRecords = [];
        let isDisplaySyncStarted = false;
        let changeCounterIdleTimer = null;

        function getScanContentText(item) {
            if (item == null) return '';
            if (typeof item === 'object' && item !== null) {
                if (item.content != null) return String(item.content).trim();
                if (item.data != null) return String(item.data).trim();
            }
            return String(item).trim();
        }

        function normalizeScanRecord(item, index) {
            const content = getScanContentText(item);
            let counterId = 'legacy';
            let scannedAt = Date.now();
            if (typeof item === 'object' && item !== null) {
                counterId = item.counterId != null ? String(item.counterId) : 'legacy';
                const parsedScannedAt = Number(item.scannedAt);
                if (!Number.isNaN(parsedScannedAt) && parsedScannedAt > 0) {
                    scannedAt = parsedScannedAt;
                }
            }
            return {
                id: index,
                content: content,
                counterId: counterId,
                scannedAt: scannedAt
            };
        }

        function applyCounterUi(counterId) {
            const label = 'Counter ' + counterId;
            counterBadgeEl.style.display = 'inline-block';
            counterBadgeEl.textContent = label;
            subtitleEl.textContent = 'Paparan khas untuk ' + label;
            emptyTextEl.textContent = 'No tickets scanned yet for ' + label + '.';
        }

        function renderCounterItems(records) {
            totalEl.textContent = records.length;
            emptyEl.style.display = records.length === 0 ? 'block' : 'none';
            gridEl.style.display = records.length === 0 ? 'none' : 'grid';
            gridEl.innerHTML = '';
            records.forEach((record) => {
                const card = document.createElement('div');
                card.className = 'ticket-card';
                card.textContent = record.content;
                gridEl.appendChild(card);
            });
        }

        function renderSelectedCounter() {
            const filtered = latestRecords.filter((record) => record.counterId === selectedCounterId);
            filtered.sort((a, b) => b.id - a.id);
            renderCounterItems(filtered);
        }

        function startDisplaySync() {
            if (isDisplaySyncStarted) {
                renderSelectedCounter();
                return;
            }
            isDisplaySyncStarted = true;
            database.ref('drawResults/items').on('value', (snapshot) => {
                const raw = snapshot.val();
                latestRecords = [];
                if (raw && Array.isArray(raw)) {
                    latestRecords = raw.map((item, index) => normalizeScanRecord(item, index))
                        .filter((record) => record.content);
                }
                renderSelectedCounter();
            });
        }

        function chooseCounter(counterId) {
            selectedCounterId = String(counterId);
            sessionStorage.setItem(COUNTER_STORAGE_KEY, selectedCounterId);
            applyCounterUi(selectedCounterId);
            selectorOverlayEl.style.display = 'none';
            changeCounterBtnEl.style.display = 'inline-block';
            showChangeCounterButton();
            resetChangeCounterIdleTimer();
            startDisplaySync();
        }

        function initializeCounterSelection() {
            const buttons = selectorOverlayEl.querySelectorAll('button[data-counter]');
            buttons.forEach((btn) => {
                btn.addEventListener('click', () => {
                    chooseCounter(btn.getAttribute('data-counter') || '1');
                });
            });

            const savedCounter = sessionStorage.getItem(COUNTER_STORAGE_KEY);
            if (savedCounter && ['1', '2', '3', '4'].includes(savedCounter)) {
                chooseCounter(savedCounter);
                return;
            }
            selectorOverlayEl.style.display = 'flex';
        }

        changeCounterBtnEl.addEventListener('click', () => {
            selectorOverlayEl.style.display = 'flex';
            showChangeCounterButton();
        });

        function showChangeCounterButton() {
            if (changeCounterBtnEl.style.display === 'none') return;
            changeCounterBtnEl.classList.remove('is-faded');
        }

        function hideChangeCounterButton() {
            if (selectorOverlayEl.style.display === 'flex') return;
            changeCounterBtnEl.classList.add('is-faded');
        }

        function resetChangeCounterIdleTimer() {
            if (changeCounterBtnEl.style.display === 'none') return;
            if (changeCounterIdleTimer) clearTimeout(changeCounterIdleTimer);
            showChangeCounterButton();
            changeCounterIdleTimer = setTimeout(hideChangeCounterButton, CHANGE_COUNTER_IDLE_MS);
        }

        ['mousemove', 'mousedown', 'touchstart', 'keydown'].forEach((evt) => {
            document.addEventListener(evt, resetChangeCounterIdleTimer, { passive: true });
        });

        initializeCounterSelection();
    </script>
</body>
</html>
